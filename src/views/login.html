<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/css/login.css" />
		<script defer src="/js/login.js"></script>
		<title>Login — Edulab</title>
	</head>
	<body>
		<div class="bg-grid"></div>
		<div class="bg-glow"></div>
		<div class="bg-orb bg-orb-1"></div>
		<div class="bg-orb bg-orb-2"></div>

		<div class="login-card">
			<div class="card-top-border"></div>

			<div class="brand">
				<div class="brand-icon">EL</div>
				<div class="brand-name">Edu<span>lab</span></div>
			</div>

			<div class="login-heading">
				<h1>Welcome back</h1>
				<p>Sign in to your account to continue</p>
			</div>

			<form id="loginForm">
				<div class="field-group">
					<div class="field">
						<label for="username_input">Username</label>
						<div class="field-wrap">
							<span class="field-icon">
								<svg
									width="16"
									height="16"
									fill="none"
									viewBox="0 0 24 24"
									stroke="currentColor"
									stroke-width="2"
								>
									<path
										stroke-linecap="round"
										stroke-linejoin="round"
										d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
									/>
								</svg>
							</span>
							<input
								type="text"
								id="username_input"
								placeholder="Enter username"
								required
								autocomplete="username"
							/>
						</div>
					</div>

					<div class="field">
						<label for="password_input">Password</label>
						<div class="field-wrap">
							<span class="field-icon">
								<svg
									width="16"
									height="16"
									fill="none"
									viewBox="0 0 24 24"
									stroke="currentColor"
									stroke-width="2"
								>
									<path
										stroke-linecap="round"
										stroke-linejoin="round"
										d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
									/>
								</svg>
							</span>
							<input
								type="password"
								id="password_input"
								class="pw-input"
								placeholder="Enter password"
								required
								autocomplete="current-password"
							/>
							<button
								type="button"
								class="toggle-btn"
								id="passwordHide"
								aria-label="Toggle password visibility"
							>
								<svg
									id="eye-icon"
									width="16"
									height="16"
									fill="none"
									viewBox="0 0 24 24"
									stroke="currentColor"
									stroke-width="2"
								>
									<path
										stroke-linecap="round"
										stroke-linejoin="round"
										d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
									/>
									<path
										stroke-linecap="round"
										stroke-linejoin="round"
										d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
									/>
								</svg>
							</button>
						</div>
					</div>
				</div>

				<button type="submit" class="sign-btn" id="signInBtn">
					<span class="btn-text">Sign In</span>
					<span class="btn-spinner"
						><span class="spinner-ring"></span
					></span>
				</button>

				<div class="error-msg" id="errorMsg"></div>
			</form>

			<div class="footer-note">Edulab Learning Management System</div>
		</div>
	</body>
</html>
